[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-data-science"
version = "0.1.0"
description = "Version-aware arXiv corpus pipeline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arxiv-pipeline = "arxiv_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]
